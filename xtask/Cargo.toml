[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Workspace task runner for switchback-rs: check/ci, coverage, profile, parse, render, and vendor tasks."

[lib]
path = "src/lib.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
buf-tools.workspace = true
switchback-mdbook = { path = "../crates/switchback-mdbook" }
toml = "1"
toml_edit.workspace = true
